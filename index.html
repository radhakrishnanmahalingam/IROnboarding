<style>

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--txt); font-family: Montserrat, system-ui, sans-serif; overflow: hidden; }
header { height: 56px; display: flex; align-items: center; gap: 14px; padding: 0 16px; }

#toc { max-width: 640px; margin: 0 auto; list-style: none; padding: 0; }
#toc li a { display: flex; justify-content: space-between; gap: 12px; padding: 10px 12px; color: var(--txt); text-decoration: none; border-bottom: 1px solid rgba(127,127,127,.2); }

#toc li.l1 a { padding-left: 30px; font-size: 14px; }
#toc li a span { color: var(--mut); font-weight: 500; }
#toc li a:hover { background: rgba(127,127,127,.12); }

#zoom.on { display: block; }
#zoom img { width: 200vw; max-width: 3200px; display: block; margin: 0 auto; }
#toast { position: fixed; left: 50%; bottom: 80px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 8px 14px; border-radius: 6px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 40; }
@media (max-width: 640px) { #scrub, .hide-sm { display: none; } .nav { width: 36px; font-size: 34px; } header h1 { font-size: 13px; } }
</style>

  var book = document.getElementById('book'), cur = 1, busy = false;
  var base = new Image(); base.className = 'pg'; base.alt = ''; book.appendChild(base);

    if (fwd) { base.src = src(i); }

    }
